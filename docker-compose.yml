services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: student_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - student_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d student_manager"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  student_data:
