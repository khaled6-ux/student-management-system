name: Backend CI

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "backend/**"
      - "database/**"
      - "CMakeLists.txt"
      - "vcpkg.json"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "database/**"
      - "CMakeLists.txt"
      - "vcpkg.json"
      - ".github/workflows/backend-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      STUDENT_DB_PATH: /tmp/student-management-ci.db
      PORT: "8080"
      CORS_ORIGIN: http://127.0.0.1:5173
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y curl zip unzip tar pkg-config
      - name: Bootstrap vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
      - name: Configure CMake
        run: |
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DCMAKE_BUILD_TYPE=Release -DVCPKG_TARGET_TRIPLET=x64-linux
      - name: Build C++ API and tests
        run: cmake --build build --parallel 2
      - name: Run C++ unit and SQLite repository tests
        run: ctest --test-dir build --output-on-failure
      - name: Start local API
        run: |
          ./build/student-api > "$RUNNER_TEMP/student-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/student-api.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/student-api.log"
          exit 1
      - name: Run HTTP CRUD integration tests against SQLite
        run: python3 backend/tests/api_integration.py
      - name: Show API logs on failure
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/student-api.log" ]; then
            cat "$RUNNER_TEMP/student-api.log"
          fi
